# Example Hearth WASM plugin in Rust. See docs/plugins.md.
# Build: cargo build --release --target wasm32-wasip1
#   then copy target/wasm32-wasip1/release/rust-lamp.wasm next to plugin.yaml as lamp.wasm.
[package]
name = "rust-lamp"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
