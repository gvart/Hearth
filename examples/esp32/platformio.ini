;
; Reference Hearth Device Protocol v1 client for the ESP32 (docs/spec/device-protocol-v1.md).
; Not built in CI: build and flash it with `pio run -t upload`.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0
