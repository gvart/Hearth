# https://taskfile.dev
version: '3'

vars:
  BIN: bin/hearth{{exeExt}}
  VERSION:
    sh: git describe --tags --dirty 2>/dev/null || echo v0.0.0-dev
  COMMIT:
    sh: git rev-parse --short=12 HEAD 2>/dev/null || echo unknown
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}
  WEBUI_DIST: internal/hub/webui/dist
  # Build tags of the release: Tailscale (tsnet, docs/tailscale.md) without the
  # Tailscale features the hub does not use. Keep in step with .goreleaser.yaml.
  # cmd/hearth/tailnet_tsnet_test.go runs a tailnet with exactly these.
  TAILSCALE_TAGS: tailscale,ts_omit_ace,ts_omit_advertiseexitnode,ts_omit_advertiseroutes,ts_omit_appconnectors,ts_omit_aws,ts_omit_bird,ts_omit_c2n,ts_omit_captiveportal,ts_omit_capture,ts_omit_cliconndiag,ts_omit_clientupdate,ts_omit_cloud,ts_omit_colorable,ts_omit_completion,ts_omit_completion_scripts,ts_omit_conn25,ts_omit_dbus,ts_omit_debug,ts_omit_debugeventbus,ts_omit_debugportmapper,ts_omit_desktop_sessions,ts_omit_doctor,ts_omit_drive,ts_omit_flashappliance,ts_omit_gro,ts_omit_hujsonconf,ts_omit_identityfederation,ts_omit_iptables,ts_omit_kube,ts_omit_linkspeed,ts_omit_linuxdnsfight,ts_omit_listenrawdisco,ts_omit_logtail,ts_omit_netlog,ts_omit_networkmanager,ts_omit_oauthkey,ts_omit_osrouter,ts_omit_outboundproxy,ts_omit_peerapiserver,ts_omit_portlist,ts_omit_posture,ts_omit_qrcodes,ts_omit_relayserver,ts_omit_remoteconfig,ts_omit_resolved,ts_omit_routecheck,ts_omit_runtimemetrics,ts_omit_sdnotify,ts_omit_serviceclientprefs,ts_omit_synology,ts_omit_syslog,ts_omit_systray,ts_omit_taildrop,ts_omit_tap,ts_omit_tpm,ts_omit_tundevstats,ts_omit_unixsocketidentity,ts_omit_useexitnode,ts_omit_usermetrics,ts_omit_useroutes,ts_omit_wakeonlan,ts_omit_webbrowser,ts_omit_webclient
  GORELEASER_VERSION: v2.20.2

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the web UI and the hearth binary into ./bin (honours GOOS/GOARCH)
    cmds:
      - task: web:embed
      - task: go:build

  test:
    desc: Run Go tests with the race detector
    cmds:
      # Inline (not `env:`) so it overrides any CGO_ENABLED in the caller's shell;
      # the race detector needs cgo, release builds stay CGO_ENABLED=0.
      - CGO_ENABLED=1 go test -race ./...
      # The hub's Tailscale code is built only with the release tags.
      - CGO_ENABLED=1 go test -race -tags '{{.TAILSCALE_TAGS}}' ./cmd/hearth/

  test:web:
    desc: Run the web UI's tests (the automation editor's YAML round trip)
    deps: [web:deps]
    dir: web
    cmds:
      - npm test

  lint:
    desc: Run golangci-lint, eslint and tsc
    deps: [web:deps]
    cmds:
      - scripts/check-spdx.sh
      - golangci-lint run ./...
      - golangci-lint run --build-tags '{{.TAILSCALE_TAGS}}' ./cmd/hearth/...
      - npm --prefix web run lint
      - npm --prefix web run typecheck

  proto:
    desc: Lint .proto sources and generate protobuf/Connect code into internal/proto with buf
    cmds:
      - buf lint
      - buf generate

  e2e:
    desc: Run the compose-based end-to-end test of the headline demo (needs Docker with compose)
    cmds:
      - go test -tags e2e -count=1 -v -run '^TestHeadlineDemo$' ./test/e2e/...

  e2e:cluster:
    desc: Run the compose-based end-to-end test of a 3-hub cluster (needs Docker with compose)
    cmds:
      - go test -tags e2e -count=1 -v -run '^TestCluster$' ./test/e2e/...

  e2e:autohub:
    desc: Run the compose-based end-to-end test of devices becoming hubs from the install command, then the first hub killed (needs Docker with compose)
    cmds:
      - go test -tags e2e -count=1 -v -timeout 20m -run '^TestAutoHubs$' ./test/e2e/...

  e2e:install:
    desc: Test deploy/install.sh end to end in a Debian 12 container (needs Docker)
    cmds:
      - deploy/test/install-e2e.sh

  dev:
    desc: Run the web UI dev server with hot reload (the hub joins once it exists)
    deps: [web:deps]
    dir: web
    cmds:
      - npm run dev

  docs:
    desc: Run the docs site (site/, Astro Starlight over docs/*.md) dev server with hot reload
    deps: [docs:deps]
    dir: site
    cmds:
      - npm run dev

  docs:build:
    desc: Build the static docs site into site/dist
    deps: [docs:deps]
    dir: site
    cmds:
      - npm run build

  release:snapshot:
    desc: Build all release archives and the image locally with goreleaser, without publishing (pass `-- --skip=docker` without Docker buildx)
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}} release --snapshot --clean --skip=publish {{.CLI_ARGS}}

  go:build:
    internal: true
    cmds:
      # Inline so a CGO_ENABLED from the caller's shell can never produce a cgo binary.
      # The -gcflags match .goreleaser.yaml, which explains them.
      - CGO_ENABLED=0 go build -tags '{{.TAILSCALE_TAGS}}' -trimpath -gcflags=all=-l -gcflags=modernc.org/...= -gcflags=runtime= -gcflags=runtime/...= -gcflags=sync= -gcflags=sync/...= -gcflags=internal/...= -gcflags=crypto/...= -gcflags=encoding/...= -gcflags=google.golang.org/protobuf/...= -gcflags=connectrpc.com/...= -ldflags "{{.LDFLAGS}}" -o {{.BIN}} ./cmd/hearth

  web:deps:
    internal: true
    dir: web
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci --no-audit --no-fund

  docs:deps:
    internal: true
    dir: site
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci --no-audit --no-fund

  web:build:
    internal: true
    deps: [web:deps]
    dir: web
    sources:
      - index.html
      - package-lock.json
      - public/**/*
      - src/**/*
      - tsconfig.json
      - vite.config.ts
    generates: [dist/index.html]
    cmds:
      - npm run build

  web:embed:
    internal: true
    deps: [web:build]
    cmds:
      # Copies web/dist with text assets gzipped; the hub serves them as is.
      - node scripts/embed-webui.mjs web/dist {{.WEBUI_DIST}}
