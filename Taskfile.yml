# https://taskfile.dev
version: '3'

vars:
  BIN: bin/hearth{{exeExt}}
  VERSION:
    sh: git describe --tags --dirty 2>/dev/null || echo v0.0.0-dev
  COMMIT:
    sh: git rev-parse --short=12 HEAD 2>/dev/null || echo unknown
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}
  WEBUI_DIST: internal/hub/webui/dist
  GORELEASER_VERSION: v2.20.2

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the web UI and the hearth binary into ./bin (honours GOOS/GOARCH)
    cmds:
      - task: web:embed
      - task: go:build

  test:
    desc: Run Go tests with the race detector
    cmds:
      # Inline (not `env:`) so it overrides any CGO_ENABLED in the caller's shell;
      # the race detector needs cgo, release builds stay CGO_ENABLED=0.
      - CGO_ENABLED=1 go test -race ./...

  test:web:
    desc: Run the web UI's tests (the automation editor's YAML round trip)
    deps: [web:deps]
    dir: web
    cmds:
      - npm test

  lint:
    desc: Run golangci-lint, eslint and tsc
    deps: [web:deps]
    cmds:
      - scripts/check-spdx.sh
      - golangci-lint run ./...
      - npm --prefix web run lint
      - npm --prefix web run typecheck

  proto:
    desc: Lint .proto sources and generate protobuf/Connect code into internal/proto with buf
    cmds:
      - buf lint
      - buf generate

  e2e:
    desc: Run the compose-based end-to-end test of the headline demo (needs Docker with compose)
    cmds:
      - go test -tags e2e -count=1 -v -run '^TestHeadlineDemo$' ./test/e2e/...

  e2e:cluster:
    desc: Run the compose-based end-to-end test of 3-hub cluster failover (needs Docker with compose)
    cmds:
      - go test -tags e2e -count=1 -v -run '^TestClusterFailover$' ./test/e2e/...

  e2e:install:
    desc: Test deploy/install.sh end to end in a Debian 12 container (needs Docker)
    cmds:
      - deploy/test/install-e2e.sh

  dev:
    desc: Run the web UI dev server with hot reload (the hub joins once it exists)
    deps: [web:deps]
    dir: web
    cmds:
      - npm run dev

  docs:
    desc: Run the docs site (site/, Astro Starlight over docs/*.md) dev server with hot reload
    deps: [docs:deps]
    dir: site
    cmds:
      - npm run dev

  docs:build:
    desc: Build the static docs site into site/dist
    deps: [docs:deps]
    dir: site
    cmds:
      - npm run build

  release:snapshot:
    desc: Build all release archives and the image locally with goreleaser, without publishing (pass `-- --skip=docker` without Docker buildx)
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}} release --snapshot --clean --skip=publish {{.CLI_ARGS}}

  go:build:
    internal: true
    cmds:
      # Inline so a CGO_ENABLED from the caller's shell can never produce a cgo binary.
      # The -gcflags match .goreleaser.yaml, which explains them.
      - CGO_ENABLED=0 go build -trimpath -gcflags=all=-l -gcflags=modernc.org/...= -gcflags=runtime= -gcflags=runtime/...= -gcflags=sync= -gcflags=sync/...= -gcflags=internal/...= -ldflags "{{.LDFLAGS}}" -o {{.BIN}} ./cmd/hearth

  web:deps:
    internal: true
    dir: web
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci --no-audit --no-fund

  docs:deps:
    internal: true
    dir: site
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci --no-audit --no-fund

  web:build:
    internal: true
    deps: [web:deps]
    dir: web
    sources:
      - index.html
      - package-lock.json
      - public/**/*
      - src/**/*
      - tsconfig.json
      - vite.config.ts
    generates: [dist/index.html]
    cmds:
      - npm run build

  web:embed:
    internal: true
    deps: [web:build]
    cmds:
      - rm -rf {{.WEBUI_DIST}}
      - mkdir -p {{.WEBUI_DIST}}
      - cp -R web/dist/. {{.WEBUI_DIST}}/
      - touch {{.WEBUI_DIST}}/.gitkeep
