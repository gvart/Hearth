# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release pipeline (T9). Run by .github/workflows/release.yml on `v*` tags;
# try it locally with `task release:snapshot`.
#
# The archive names below are a contract: deploy/install.sh downloads
# hearth_<version>_<os>_<arch>.tar.gz and verifies it against checksums.txt.
version: 2

project_name: hearth

before:
  hooks:
    # Same steps as `task build` (web:deps, web:build, web:embed): the web UI
    # is embedded into the binary, so it has to exist before `go build`.
    - npm --prefix web ci --no-audit --no-fund
    - npm --prefix web run build
    - node scripts/embed-webui.mjs web/dist internal/hub/webui/dist

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

builds:
  - id: hearth
    main: ./cmd/hearth
    binary: hearth
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      # Tailscale (tsnet, docs/tailscale.md), without the Tailscale features the
      # hub does not use: keep in step with TAILSCALE_TAGS in Taskfile.yml.
      - -tags=tailscale,ts_omit_ace,ts_omit_advertiseexitnode,ts_omit_advertiseroutes,ts_omit_appconnectors,ts_omit_aws,ts_omit_bird,ts_omit_c2n,ts_omit_captiveportal,ts_omit_capture,ts_omit_cliconndiag,ts_omit_clientupdate,ts_omit_cloud,ts_omit_colorable,ts_omit_completion,ts_omit_completion_scripts,ts_omit_conn25,ts_omit_dbus,ts_omit_debug,ts_omit_debugeventbus,ts_omit_debugportmapper,ts_omit_desktop_sessions,ts_omit_doctor,ts_omit_drive,ts_omit_flashappliance,ts_omit_gro,ts_omit_hujsonconf,ts_omit_identityfederation,ts_omit_iptables,ts_omit_kube,ts_omit_linkspeed,ts_omit_linuxdnsfight,ts_omit_listenrawdisco,ts_omit_logtail,ts_omit_netlog,ts_omit_networkmanager,ts_omit_oauthkey,ts_omit_osrouter,ts_omit_outboundproxy,ts_omit_peerapiserver,ts_omit_portlist,ts_omit_posture,ts_omit_qrcodes,ts_omit_relayserver,ts_omit_remoteconfig,ts_omit_resolved,ts_omit_routecheck,ts_omit_runtimemetrics,ts_omit_sdnotify,ts_omit_serviceclientprefs,ts_omit_synology,ts_omit_syslog,ts_omit_systray,ts_omit_taildrop,ts_omit_tap,ts_omit_tpm,ts_omit_tundevstats,ts_omit_unixsocketidentity,ts_omit_useexitnode,ts_omit_usermetrics,ts_omit_useroutes,ts_omit_wakeonlan,ts_omit_webbrowser,ts_omit_webclient
      # Keep in step with go:build in Taskfile.yml. Inlining stays on for the
      # hub's hot paths: the Go runtime, SQLite, TLS and crypto, encoding and
      # Connect/protobuf. Off elsewhere it shrinks the binary, and so the idle
      # agent's RSS (issue #145). internal/... matches only std internals.
      - -gcflags=all=-l
      - -gcflags=modernc.org/...=
      - -gcflags=runtime=
      - -gcflags=runtime/...=
      - -gcflags=sync=
      - -gcflags=sync/...=
      - -gcflags=internal/...=
      - -gcflags=crypto/...=
      - -gcflags=encoding/...=
      - -gcflags=google.golang.org/protobuf/...=
      - -gcflags=connectrpc.com/...=
    ldflags:
      - -s -w
      - -X main.version=v{{ .Version }}
      - -X main.commit={{ slice .FullCommit 0 12 }}
      - -X main.date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64

archives:
  - id: hearth
    ids: [hearth]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # hearth_0.1.0_linux_amd64.tar.gz, hearth_0.1.0_linux_armv7.tar.gz, ...
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE*
      - README*

checksum:
  name_template: checksums.txt
  algorithm: sha256

dockers_v2:
  - id: hearth
    ids: [hearth]
    dockerfile: Dockerfile
    images:
      - ghcr.io/gvart/hearth
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Hearth hub, the control plane for homelabs
      org.opencontainers.image.source: https://github.com/gvart/hearth
      org.opencontainers.image.licenses: AGPL-3.0-only
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

# Keyless (Sigstore) signing with the GitHub Actions OIDC token: needs
# `id-token: write` and cosign on PATH, so it only works in release.yml.
# Verification commands are in the README ("Verifying releases").
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    # One Sigstore bundle (signature + certificate + Rekor entry) per file:
    # checksums.txt.sigstore.json, uploaded as a release asset.
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    output: true

docker_signs:
  # Default artifacts ('') = the dockers_v2 images: one per pushed tag, each
  # signed by its manifest-list digest.
  - id: ghcr
    cmd: cosign
    args:
      - sign
      - ${artifact}@${digest}
      - --yes
    output: true

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge "
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 3
    - title: Other changes
      order: 999

release:
  github:
    owner: gvart
    name: Hearth
  # vX.Y.Z-rc.N (any semver pre-release suffix) is published as a pre-release.
  prerelease: auto
  # Created as a draft: release.yml publishes it only once checksums.txt.sig,
  # which agents need to upgrade (#359), is uploaded next to it.
  draft: true
