syntax = "proto3";

package hearth.esphome.v1;

// HelloRequest (1) opens a session.
message HelloRequest {
  string client_info = 1;
  uint32 api_version_major = 2;
  uint32 api_version_minor = 3;
}

// HelloResponse (2) answers it.
message HelloResponse {
  uint32 api_version_major = 1;
  uint32 api_version_minor = 2;
  string server_info = 3;
  string name = 4;
}

// AuthenticationRequest (3) carries the API password of firmware older than
// ESPHome 2026.1, which removed passwords.
message AuthenticationRequest {
  string password = 1;
}

// AuthenticationResponse (4) is sent only when the password is wrong.
message AuthenticationResponse {
  bool invalid_password = 1;
}

// DisconnectRequest (5) and DisconnectResponse (6) close a session, from
// either side.
message DisconnectRequest {
  // reason is the DisconnectReason enum of the original.
  int32 reason = 1;
}

// DisconnectResponse (6) acknowledges a DisconnectRequest.
message DisconnectResponse {}

// PingRequest (7) and PingResponse (8) keep a session alive, from either
// side: a device drops a client that leaves its pings unanswered.
message PingRequest {}

// PingResponse (8) answers a PingRequest.
message PingResponse {}

// DeviceInfoRequest (9) asks what the device is.
message DeviceInfoRequest {}

// DeviceInfoResponse (10) says it.
message DeviceInfoResponse {
  bool uses_password = 1;
  string name = 2;
  string mac_address = 3;
  string esphome_version = 4;
  string compilation_time = 5;
  string model = 6;
  string manufacturer = 12;
  string friendly_name = 13;
}

// ListEntitiesRequest (11) asks for the entities: the device answers with one
// ListEntities*Response each, then ListEntitiesDoneResponse.
message ListEntitiesRequest {}

// ListEntitiesBinarySensorResponse (12) describes a binary sensor.
message ListEntitiesBinarySensorResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  reserved 4;
  string device_class = 5;
  bool is_status_binary_sensor = 6;
  bool disabled_by_default = 7;
  string icon = 8;
  // entity_category is the EntityCategory enum of the original.
  int32 entity_category = 9;
}

// ListEntitiesSensorResponse (16) describes a sensor.
message ListEntitiesSensorResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  reserved 4;
  string icon = 5;
  string unit_of_measurement = 6;
  int32 accuracy_decimals = 7;
  bool force_update = 8;
  string device_class = 9;
  // state_class is the SensorStateClass enum of the original.
  int32 state_class = 10;
  reserved 11;
  bool disabled_by_default = 12;
  int32 entity_category = 13;
}

// ListEntitiesSwitchResponse (17) describes a switch.
message ListEntitiesSwitchResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  reserved 4;
  string icon = 5;
  bool assumed_state = 6;
  bool disabled_by_default = 7;
  int32 entity_category = 8;
  string device_class = 9;
}

// ListEntitiesTextSensorResponse (18) describes a text sensor.
message ListEntitiesTextSensorResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  reserved 4;
  string icon = 5;
  bool disabled_by_default = 6;
  int32 entity_category = 7;
  string device_class = 8;
}

// ListEntitiesDoneResponse (19) ends the entity list.
message ListEntitiesDoneResponse {}

// SubscribeStatesRequest (20) asks for every entity's state, now and on
// each change.
message SubscribeStatesRequest {}

// BinarySensorStateResponse (21) is a binary sensor's state.
message BinarySensorStateResponse {
  fixed32 key = 1;
  bool state = 2;
  bool missing_state = 3;
}

// SensorStateResponse (25) is a sensor's state.
message SensorStateResponse {
  fixed32 key = 1;
  float state = 2;
  bool missing_state = 3;
}

// SwitchStateResponse (26) is a switch's state.
message SwitchStateResponse {
  fixed32 key = 1;
  bool state = 2;
  reserved 3;
  bool missing_state = 4;
}

// TextSensorStateResponse (27) is a text sensor's state.
message TextSensorStateResponse {
  fixed32 key = 1;
  string state = 2;
  bool missing_state = 3;
}

// SwitchCommandRequest (33) turns a switch on or off.
message SwitchCommandRequest {
  fixed32 key = 1;
  bool state = 2;
}

// ListEntitiesButtonResponse (61) describes a button.
message ListEntitiesButtonResponse {
  string object_id = 1;
  fixed32 key = 2;
  string name = 3;
  reserved 4;
  string icon = 5;
  bool disabled_by_default = 6;
  int32 entity_category = 7;
  string device_class = 8;
}

// ButtonCommandRequest (62) presses a button.
message ButtonCommandRequest {
  fixed32 key = 1;
}
