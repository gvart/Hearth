syntax = "proto3";

package hearth.agent.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// AgentService is the channel between an agent and the hub. Agents always dial out;
// the hub never connects to a device.
service AgentService {
  // Connect opens the agent's long-lived stream. The first AgentMessage must be a Hello.
  rpc Connect(stream AgentMessage) returns (stream HubMessage);
}

// AgentMessage is anything an agent sends to the hub.
message AgentMessage {
  oneof payload {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    MetricsBatch metrics_batch = 3;
    ExecResult exec_result = 4;
    // Facts re-sent periodically by the agent; protocol_version and device_id are ignored.
    Hello facts = 5;
    ProbeResult probe_result = 6;
    LogLines log_lines = 7;
    ShellEvent shell_event = 8;
  }
}

// HubMessage is anything the hub sends to an agent.
message HubMessage {
  oneof payload {
    Welcome welcome = 1;
    ExecRequest exec_request = 2;
    Ping ping = 3;
    ProbeRequest probe_request = 4;
    LogRequest log_request = 5;
    LogCancel log_cancel = 6;
    ShellRequest shell_request = 7;
  }
}

// ProtocolVersion is the agent<->hub protocol version. A major bump is incompatible;
// the hub rejects majors it does not know.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// Hello is the first message on every stream: who the device is and what it can do.
message Hello {
  ProtocolVersion protocol_version = 1;
  string device_id = 2;
  string hostname = 3;
  string os = 4;
  string arch = 5;
  string kernel = 6;
  string cpu_model = 7;
  uint32 cpu_cores = 8;
  uint64 mem_total_bytes = 9;
  repeated Disk disks = 10;
  repeated NetworkInterface interfaces = 11;
  string agent_version = 12;
  repeated string capabilities = 13;
  // ceiling is the device's capability ceiling, sent by agents of protocol
  // minor 2 and later, in every Hello and Facts. The hub refuses to send an
  // ExecRequest beyond it, and to send any to an agent that does not report
  // it; the agent refuses again what is beyond it.
  Ceiling ceiling = 14;
}

// Ceiling is what a device's agent lets the hub run: its own configuration,
// which the hub can never raise. An empty Ceiling allows nothing.
message Ceiling {
  // exec are the programs the hub may run, matched exactly against
  // Command.argv[0], with any arguments.
  repeated string exec = 1;
  // restart are the services the hub may restart, as manager:name (see
  // RestartService).
  repeated string restart = 2;
  // probe allows ProbeRequests: the hub may run HTTP, TCP and DNS checks
  // from this device. Reported by agents of protocol minor 3 and later.
  bool probe = 3;
  // logs are the log sources the hub may read, as manager:pattern, where
  // manager is "systemd", "systemd-user" or "docker" and pattern a name or a
  // glob (path.Match) such as "*". Reported by agents of protocol minor 5
  // and later.
  repeated string logs = 4;
  // shell allows ShellRequests: the hub may open an interactive shell, on a
  // pseudo-terminal, as the agent's user. Reported by agents of protocol
  // minor 6 and later.
  bool shell = 5;
}

// Disk is a mounted filesystem.
message Disk {
  string device = 1;
  string mountpoint = 2;
  string fstype = 3;
  uint64 total_bytes = 4;
}

// NetworkInterface is a network interface and its addresses.
message NetworkInterface {
  string name = 1;
  string mac = 2;
  repeated string ips = 3;
}

// Heartbeat tells the hub the agent is alive.
message Heartbeat {
  google.protobuf.Timestamp ts = 1;
  google.protobuf.Duration uptime = 2;
}

// MetricsBatch carries metric samples collected since the last batch. Agents
// of protocol minor 4 and later send one every 15 s, with a sample of each
// host metric the platform provides: cpu, memory and disk (of the root
// filesystem) in percent, temperature in °C (the hottest thermal zone), and
// net_rx and net_tx in bytes per second over the non-loopback interfaces.
// The hub records only those names, stamped with its own clock; labels are
// ignored.
message MetricsBatch {
  repeated MetricSample samples = 1;
}

// MetricSample is a single metric observation.
message MetricSample {
  string name = 1;
  map<string, string> labels = 2;
  double value = 3;
  google.protobuf.Timestamp ts = 4;
}

// ExecResult is the outcome of an ExecRequest, sent by agents of protocol
// minor 1 and later.
message ExecResult {
  // id is the id of the ExecRequest it answers.
  string id = 1;
  // denied is set when the agent refused the request: it is beyond the
  // device's capability ceiling, the agent's own configuration. Nothing ran.
  bool denied = 2;
  // exit_code is the exit status of the process; -1 if it did not run or
  // was killed.
  int32 exit_code = 3;
  // error says why the request failed or was denied; empty on success. It
  // may end with the last bytes the process wrote to stderr.
  string error = 4;
}

// Welcome acknowledges a Hello.
message Welcome {
  google.protobuf.Timestamp server_time = 1;
  google.protobuf.Duration heartbeat_interval = 2;
  // hubs are the agent-facing URLs (https://host:port) of every hub in the
  // cluster, the leader included. Agents keep them to fail over between hubs.
  // A single hub lists only itself, or nothing when it does not know its URL.
  repeated string hubs = 3;
}

// NotLeader is the error detail a hub that is not the cluster leader attaches
// when it refuses AgentService.Connect or EnrollService.Enroll, with code
// FAILED_PRECONDITION. Only the leader serves agents and enrollment.
message NotLeader {
  // leader_url is the leader's agent-facing URL, or empty while no leader is known.
  string leader_url = 1;
  // hubs are the agent-facing URLs of every hub in the cluster, as in Welcome.
  repeated string hubs = 2;
}

// CertificateRevoked is the error detail a hub attaches, with code
// UNAUTHENTICATED, when it refuses or ends AgentService.Connect because the
// device's certificate is revoked. Only a hub that can vouch for its store
// (a standalone hub, or the cluster leader within its term) sends it. The
// agent stops on it instead of retrying: the device must re-enroll.
message CertificateRevoked {}

// ExecRequest asks the agent to run an action. The agent runs it only if its
// capability ceiling allows it, and answers with an ExecResult of the same id.
// Hubs send it only to agents of protocol minor 1 and later.
message ExecRequest {
  // id correlates the ExecResult; unique per stream.
  string id = 1;
  // timeout bounds the run; the agent kills the process when it expires.
  google.protobuf.Duration timeout = 2;
  oneof action {
    Command command = 3;
    RestartService restart = 4;
  }
}

// Command runs a program with arguments, never through a shell.
message Command {
  // argv is the program and its arguments; argv[0] is matched against the
  // ceiling as written.
  repeated string argv = 1;
}

// RestartService restarts a service the device runs.
message RestartService {
  // manager is "systemd", "systemd-user" (systemctl --user) or "docker".
  string manager = 1;
  // name is the systemd unit or Docker container.
  string name = 2;
}

// ProbeRequest asks the agent to run a network check from the device, as an
// automation's http, tcp or dns trigger does from the hub. The agent runs it
// only if its ceiling allows probes, and answers with a ProbeResult of the
// same id. Hubs send it only to agents of protocol minor 3 and later.
message ProbeRequest {
  // id correlates the ProbeResult; unique per stream.
  string id = 1;
  // timeout bounds the check.
  google.protobuf.Duration timeout = 2;
  oneof probe {
    HTTPProbe http = 3;
    TCPProbe tcp = 4;
    DNSProbe dns = 5;
  }
}

// HTTPProbe GETs a URL and checks the status.
message HTTPProbe {
  // url is http(s)://host[:port][/path]; it may carry credentials, which the
  // agent never logs.
  string url = 1;
  // status is the status expected; 0 means any 2xx or 3xx.
  int32 status = 2;
}

// TCPProbe opens a TCP connection.
message TCPProbe {
  // address is host:port.
  string address = 1;
}

// DNSProbe asks a DNS server, over UDP, for the A records of a name.
message DNSProbe {
  // name is the domain name.
  string name = 1;
  // server is host:port.
  string server = 2;
}

// ProbeResult is the outcome of a ProbeRequest.
message ProbeResult {
  // id is the id of the ProbeRequest it answers.
  string id = 1;
  // denied is set when the agent refused the request: its ceiling does not
  // allow probes. Nothing ran.
  bool denied = 2;
  // error says why the check failed or was denied; empty when it passed.
  string error = 3;
}

// LogRequest asks the agent to stream a log source: its last lines, then
// new lines as they are written, until the hub sends a LogCancel of the same
// id or the stream ends. The agent streams only sources its ceiling allows
// and answers with LogLines of the same id. Hubs send it only to agents of
// protocol minor 5 and later.
message LogRequest {
  // id correlates the LogLines and a LogCancel; unique per stream.
  string id = 1;
  // source is what to read.
  LogSource source = 2;
  // tail is how many of the last lines to send first; the agent caps it.
  uint32 tail = 3;
}

// LogSource names a log: a systemd unit, a user's systemd unit, or a Docker
// container.
message LogSource {
  // manager is "systemd", "systemd-user" (journalctl --user) or "docker".
  string manager = 1;
  // name is the unit or container.
  string name = 2;
}

// LogCancel ends the log stream of a LogRequest.
message LogCancel {
  string id = 1;
}

// LogLines carries lines of a log stream.
message LogLines {
  // id is the id of the LogRequest it answers.
  string id = 1;
  repeated LogLine lines = 2;
  // end is set on the last message of a stream: the source ended or failed
  // (error says why), or the agent refused it (denied).
  bool end = 3;
  // denied is set when the agent refused the request: the source is beyond
  // its ceiling. Nothing ran.
  bool denied = 4;
  string error = 5;
  // skipped counts lines dropped before these because the hub read too
  // slowly.
  uint64 skipped = 6;
}

// LogLine is one line of a log.
message LogLine {
  // ts is when the line was written, if the source says.
  google.protobuf.Timestamp ts = 1;
  string text = 2;
}

// Ping checks the stream is alive.
message Ping {}

// ShellRequest drives an interactive shell session on the device, one PTY
// per id. The agent opens it only if its ceiling allows shells, and answers
// with ShellEvents of the same id. Hubs send it only to agents of protocol
// minor 6 and later.
message ShellRequest {
  // id names the session; unique per stream. The hub picks it on open.
  string id = 1;
  oneof op {
    // open starts the shell. The agent answers ShellStarted, or ShellExited
    // when it refuses or fails.
    ShellOpen open = 2;
    // input is written to the PTY as is.
    bytes input = 3;
    // resize changes the PTY's window size.
    TerminalSize resize = 4;
    // ack tells the agent the hub delivered this many more output bytes.
    // The agent stops reading the PTY while too many are unacknowledged.
    uint32 ack = 5;
    // close ends the session: the agent kills the shell's process group.
    ShellClose close = 6;
  }
}

// ShellOpen starts a shell session.
message ShellOpen {
  TerminalSize size = 1;
}

// TerminalSize is a terminal's size in character cells.
message TerminalSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

// ShellClose ends a shell session.
message ShellClose {}

// ShellEvent is what happens in a shell session.
message ShellEvent {
  // id is the id of the session's ShellRequests.
  string id = 1;
  oneof event {
    ShellStarted started = 2;
    // output is what the PTY wrote, in order.
    bytes output = 3;
    // exited is always the session's last event.
    ShellExited exited = 4;
  }
}

// ShellStarted says the shell runs.
message ShellStarted {
  // shell is the program the agent started, as /bin/bash.
  string shell = 1;
}

// ShellExited ends a shell session.
message ShellExited {
  // denied is set when the agent refused the session: its ceiling does not
  // allow shells. Nothing ran.
  bool denied = 1;
  // exit_code is the shell's exit status; -1 if it did not run or was killed.
  int32 exit_code = 2;
  // error says why the session failed or was denied; empty when the shell
  // exited by itself.
  string error = 3;
}
