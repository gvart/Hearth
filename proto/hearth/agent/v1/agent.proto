// SPDX-License-Identifier: AGPL-3.0-only

syntax = "proto3";

package hearth.agent.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// AgentService is the channel between an agent and the hub. Agents always dial out;
// the hub never connects to a device.
service AgentService {
  // Connect opens the agent's long-lived stream. The first AgentMessage must be a Hello.
  rpc Connect(stream AgentMessage) returns (stream HubMessage);
}

// AgentMessage is anything an agent sends to the hub.
message AgentMessage {
  oneof payload {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    MetricsBatch metrics_batch = 3;
    ExecResult exec_result = 4;
    // Facts re-sent periodically by the agent; protocol_version and device_id are ignored.
    Hello facts = 5;
    ProbeResult probe_result = 6;
    LogLines log_lines = 7;
    ShellEvent shell_event = 8;
    ScanResult scan_result = 9;
    NetEdges net_edges = 10;
    DockerResult docker_result = 11;
    UpgradeResult upgrade_result = 12;
    // local_runs reports what the device's local rules did (#70), from
    // agents of protocol minor 12 and later. The hub answers each with a
    // LocalRunsAck once it recorded them.
    LocalRuns local_runs = 13;
  }
}

// HubMessage is anything the hub sends to an agent.
message HubMessage {
  oneof payload {
    Welcome welcome = 1;
    ExecRequest exec_request = 2;
    Ping ping = 3;
    ProbeRequest probe_request = 4;
    LogRequest log_request = 5;
    LogCancel log_cancel = 6;
    ShellRequest shell_request = 7;
    ScanRequest scan_request = 8;
    DockerRequest docker_request = 9;
    Hubs hubs = 10;
    // ceiling_config is the capability ceiling the hub manages for the
    // device (#346), sent to agents of protocol minor 10 and later on every
    // connect and on every change.
    CeilingConfig ceiling_config = 11;
    UpgradeRequest upgrade_request = 12;
    // local_rules are the automations the device runs itself (#70), sent to
    // agents of protocol minor 12 and later on every connect and on every
    // change.
    LocalRules local_rules = 13;
    // local_runs_ack tells the agent which of its reported local runs are
    // recorded, so it can drop them.
    LocalRunsAck local_runs_ack = 14;
  }
}

// CeilingConfig is the capability ceiling the hub sets for a device: the
// agent adds it to its own flags (the effective ceiling is their union),
// saves it, and applies it at once, ending the shells and log streams it no
// longer allows. An agent started with --local-ceiling ignores it. An empty
// ceiling grants nothing beyond the flags.
message CeilingConfig {
  Ceiling ceiling = 1;
  // version orders the configs of a device: the hybrid logical clock of the
  // stored row, 0 when none was set. The hub never sends one older than the
  // last it sent on the stream, and the agent ignores one older than the one
  // it applied and saved, so a stale push cannot undo a lowering.
  uint64 version = 2;
}

// ProtocolVersion is the agent<->hub protocol version. A major bump is incompatible;
// the hub rejects majors it does not know.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// Hello is the first message on every stream: who the device is and what it can do.
message Hello {
  ProtocolVersion protocol_version = 1;
  string device_id = 2;
  string hostname = 3;
  string os = 4;
  string arch = 5;
  string kernel = 6;
  string cpu_model = 7;
  uint32 cpu_cores = 8;
  uint64 mem_total_bytes = 9;
  repeated Disk disks = 10;
  repeated NetworkInterface interfaces = 11;
  string agent_version = 12;
  repeated string capabilities = 13;
  // ceiling is the device's capability ceiling, sent by agents of protocol
  // minor 2 and later, in every Hello and Facts. The hub refuses to send an
  // ExecRequest beyond it, and to send any to an agent that does not report
  // it; the agent refuses again what is beyond it.
  Ceiling ceiling = 14;
  // local_ceiling is the part of the ceiling the agent's own flags grant,
  // which the hub cannot take away. Sent by agents of protocol minor 10 and
  // later.
  Ceiling local_ceiling = 15;
  // ceiling_locked is set when the agent runs with --local-ceiling: it
  // ignores the hub's CeilingConfig, so its flags are its whole ceiling.
  // Sent by agents of protocol minor 10 and later.
  bool ceiling_locked = 16;
  // release_target is the os_arch of the release archive this agent
  // upgrades itself from (hearth_<version>_<release_target>.tar.gz), such as
  // linux_amd64 or linux_armv7, when it can replace its own binary; empty
  // when it cannot, and no_self_upgrade then says why (a Kubernetes pod, a
  // platform without a service manager to restart it). Reported by agents of
  // protocol minor 11 and later.
  string release_target = 17;
  string no_self_upgrade = 18;
  // rolled_back_from is the release an upgrade of this agent went to and
  // was rolled back from: the new binary reached no hub (it kept failing at
  // start, or stayed up with no hub welcoming it), so the previous one was
  // put back. Sent in the Hello of the binary put back until a hub welcomes
  // it; the hub keeps it while the agent reports the same version. Sent by
  // agents of protocol minor 13 and later.
  string rolled_back_from = 19;
}

// Ceiling is what a device's agent lets the hub run: its flags, and from
// protocol minor 10 the CeilingConfig the hub set, unless the agent runs with
// --local-ceiling. The agent enforces it itself. An empty Ceiling allows
// nothing.
message Ceiling {
  // exec are the programs the hub may run, matched exactly against
  // Command.argv[0], with any arguments.
  repeated string exec = 1;
  // restart are the services the hub may restart, as manager:name (see
  // RestartService), where name may be a glob (path.Match) such as "*" from
  // protocol minor 10.
  repeated string restart = 2;
  // probe allows ProbeRequests: the hub may run HTTP, TCP and DNS checks
  // from this device. Reported by agents of protocol minor 3 and later.
  bool probe = 3;
  // logs are the log sources the hub may read, as manager:pattern, where
  // manager is "systemd", "systemd-user" or "docker" and pattern a name or a
  // glob (path.Match) such as "*". Reported by agents of protocol minor 5
  // and later.
  repeated string logs = 4;
  // shell allows ShellRequests: the hub may open an interactive shell, on a
  // pseudo-terminal, as the agent's user. Reported by agents of protocol
  // minor 6 and later.
  bool shell = 5;
  // scan are the IPv4 subnets (CIDRs) the hub may have this device sweep for
  // network discovery: a ScanRequest's subnets must each lie within one of
  // them. Empty allows no scan. Reported by agents of protocol minor 7 and
  // later.
  repeated string scan = 6;
  // net_edges lets the agent report its network edges (NetEdges): its
  // neighbour table and a summary of its established TCP connections.
  // Connections say who talks to whom, so it is off unless the operator
  // turns it on. Reported by agents of protocol minor 8 and later.
  bool net_edges = 7;
  // docker allows DockerRequests: the hub may list the containers and
  // images of the device's Docker or Podman engine, read a bounded tail of
  // a container's log, and start, stop and restart containers; nothing else
  // of the engine's API. Reported by agents of protocol minor 9 and later.
  bool docker = 8;
  // docker_read allows the read DockerRequests only: listing containers and
  // images and reading a container's log tail, no start, stop or restart.
  // docker implies it. Reported by agents of protocol minor 10 and later.
  bool docker_read = 9;
}

// Disk is a mounted filesystem.
message Disk {
  string device = 1;
  string mountpoint = 2;
  string fstype = 3;
  uint64 total_bytes = 4;
  // used_bytes is the space in use when the facts were collected. An agent
  // that does not report it leaves it zero.
  uint64 used_bytes = 5;
}

// NetworkInterface is a network interface and its addresses.
message NetworkInterface {
  string name = 1;
  string mac = 2;
  repeated string ips = 3;
}

// Heartbeat tells the hub the agent is alive.
message Heartbeat {
  google.protobuf.Timestamp ts = 1;
  google.protobuf.Duration uptime = 2;
}

// MetricsBatch carries metric samples collected since the last batch. Agents
// of protocol minor 4 and later send one every 15 s, with a sample of each
// host metric the platform provides: cpu, memory and disk (of the root
// filesystem) in percent, temperature in °C (the hottest thermal zone), and
// net_rx and net_tx in bytes per second over the non-loopback interfaces.
// The hub records only those names, stamped with its own clock; labels are
// ignored.
message MetricsBatch {
  repeated MetricSample samples = 1;
}

// MetricSample is a single metric observation.
message MetricSample {
  string name = 1;
  map<string, string> labels = 2;
  double value = 3;
  google.protobuf.Timestamp ts = 4;
}

// ExecResult is the outcome of an ExecRequest, sent by agents of protocol
// minor 1 and later.
message ExecResult {
  // id is the id of the ExecRequest it answers.
  string id = 1;
  // denied is set when the agent refused the request: it is beyond the
  // device's capability ceiling, the agent's own configuration. Nothing ran.
  bool denied = 2;
  // exit_code is the exit status of the process; -1 if it did not run or
  // was killed.
  int32 exit_code = 3;
  // error says why the request failed or was denied; empty on success. It
  // may end with the last bytes the process wrote to stderr.
  string error = 4;
}

// Welcome acknowledges a Hello.
message Welcome {
  google.protobuf.Timestamp server_time = 1;
  google.protobuf.Duration heartbeat_interval = 2;
  // hubs are the agent-facing URLs (https://host:port) of every hub in the
  // cluster, the leader included. Agents keep them to fail over between hubs.
  // A single hub lists only itself, or nothing when it does not know its URL.
  repeated string hubs = 3;
  // certificate, set during a hub CA rotation, is a client certificate of the
  // new CA for the key the agent connected with (PEM). The agent saves
  // ca_bundle first, then this, and reconnects with it.
  bytes certificate = 4;
  // ca_bundle, when set, is every hub CA the agent should trust (PEM): both
  // during a hub CA rotation, the new one alone after it.
  bytes ca_bundle = 5;
}

// Hubs is the hub list a master pushes on an open stream when the masters of
// the cluster change, so an agent learns a master that appeared after it
// connected. The agent keeps it as it keeps Welcome.hubs.
message Hubs {
  // urls are the agent-facing URLs of every master, as in Welcome.hubs.
  repeated string urls = 1;
}

// NotLeader is the error detail a hub that is not the cluster leader attaches
// when it refuses AgentService.Connect or EnrollService.Enroll, with code
// FAILED_PRECONDITION. Only the leader serves agents and enrollment.
message NotLeader {
  // leader_url is the leader's agent-facing URL, or empty while no leader is known.
  string leader_url = 1;
  // hubs are the agent-facing URLs of every hub in the cluster, as in Welcome.
  repeated string hubs = 2;
}

// CertificateRevoked is the error detail a hub attaches, with code
// UNAUTHENTICATED, when it refuses or ends AgentService.Connect because the
// device's certificate is revoked. Only a hub that can vouch for its store
// (a standalone hub, or the cluster leader within its term) sends it. The
// agent stops on it instead of retrying: the device must re-enroll.
message CertificateRevoked {}

// ExecRequest asks the agent to run an action. The agent runs it only if its
// capability ceiling allows it, and answers with an ExecResult of the same id.
// Hubs send it only to agents of protocol minor 1 and later.
message ExecRequest {
  // id correlates the ExecResult; unique per stream.
  string id = 1;
  // timeout bounds the run; the agent kills the process when it expires.
  google.protobuf.Duration timeout = 2;
  oneof action {
    Command command = 3;
    RestartService restart = 4;
  }
}

// Command runs a program with arguments, never through a shell.
message Command {
  // argv is the program and its arguments; argv[0] is matched against the
  // ceiling as written.
  repeated string argv = 1;
}

// RestartService restarts a service the device runs.
message RestartService {
  // manager is "systemd", "systemd-user" (systemctl --user) or "docker".
  string manager = 1;
  // name is the systemd unit or Docker container.
  string name = 2;
}

// ProbeRequest asks the agent to run a network check from the device, as an
// automation's http, tcp or dns trigger does from the hub. The agent runs it
// only if its ceiling allows probes, and answers with a ProbeResult of the
// same id. Hubs send it only to agents of protocol minor 3 and later.
message ProbeRequest {
  // id correlates the ProbeResult; unique per stream.
  string id = 1;
  // timeout bounds the check.
  google.protobuf.Duration timeout = 2;
  oneof probe {
    HTTPProbe http = 3;
    TCPProbe tcp = 4;
    DNSProbe dns = 5;
  }
}

// HTTPProbe GETs a URL and checks the status.
message HTTPProbe {
  // url is http(s)://host[:port][/path]; it may carry credentials, which the
  // agent never logs.
  string url = 1;
  // status is the status expected; 0 means any 2xx or 3xx.
  int32 status = 2;
}

// TCPProbe opens a TCP connection.
message TCPProbe {
  // address is host:port.
  string address = 1;
}

// DNSProbe asks a DNS server, over UDP, for the A records of a name.
message DNSProbe {
  // name is the domain name.
  string name = 1;
  // server is host:port.
  string server = 2;
}

// ProbeResult is the outcome of a ProbeRequest.
message ProbeResult {
  // id is the id of the ProbeRequest it answers.
  string id = 1;
  // denied is set when the agent refused the request: its ceiling does not
  // allow probes. Nothing ran.
  bool denied = 2;
  // error says why the check failed or was denied; empty when it passed.
  string error = 3;
}

// LogRequest asks the agent to stream a log source: its last lines, then
// new lines as they are written, until the hub sends a LogCancel of the same
// id or the stream ends. The agent streams only sources its ceiling allows
// and answers with LogLines of the same id. Hubs send it only to agents of
// protocol minor 5 and later.
message LogRequest {
  // id correlates the LogLines and a LogCancel; unique per stream.
  string id = 1;
  // source is what to read.
  LogSource source = 2;
  // tail is how many of the last lines to send first; the agent caps it.
  uint32 tail = 3;
}

// LogSource names a log: a systemd unit, a user's systemd unit, or a Docker
// container.
message LogSource {
  // manager is "systemd", "systemd-user" (journalctl --user) or "docker".
  string manager = 1;
  // name is the unit or container.
  string name = 2;
}

// LogCancel ends the log stream of a LogRequest.
message LogCancel {
  string id = 1;
}

// LogLines carries lines of a log stream.
message LogLines {
  // id is the id of the LogRequest it answers.
  string id = 1;
  repeated LogLine lines = 2;
  // end is set on the last message of a stream: the source ended or failed
  // (error says why), or the agent refused it (denied).
  bool end = 3;
  // denied is set when the agent refused the request: the source is beyond
  // its ceiling. Nothing ran.
  bool denied = 4;
  string error = 5;
  // skipped counts lines dropped before these because the hub read too
  // slowly.
  uint64 skipped = 6;
}

// LogLine is one line of a log.
message LogLine {
  // ts is when the line was written, if the source says.
  google.protobuf.Timestamp ts = 1;
  string text = 2;
}

// Ping checks the stream is alive.
message Ping {}

// ShellRequest drives an interactive shell session on the device, one PTY
// per id. The agent opens it only if its ceiling allows shells, and answers
// with ShellEvents of the same id. Hubs send it only to agents of protocol
// minor 6 and later.
message ShellRequest {
  // id names the session; unique per stream. The hub picks it on open.
  string id = 1;
  oneof op {
    // open starts the shell. The agent answers ShellStarted, or ShellExited
    // when it refuses or fails.
    ShellOpen open = 2;
    // input is written to the PTY as is.
    bytes input = 3;
    // resize changes the PTY's window size.
    TerminalSize resize = 4;
    // ack tells the agent the hub delivered this many more output bytes.
    // The agent stops reading the PTY while too many are unacknowledged.
    uint32 ack = 5;
    // close ends the session: the agent kills the shell's process group.
    ShellClose close = 6;
  }
}

// ShellOpen starts a shell session.
message ShellOpen {
  TerminalSize size = 1;
}

// TerminalSize is a terminal's size in character cells.
message TerminalSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

// ShellClose ends a shell session.
message ShellClose {}

// ShellEvent is what happens in a shell session.
message ShellEvent {
  // id is the id of the session's ShellRequests.
  string id = 1;
  oneof event {
    ShellStarted started = 2;
    // output is what the PTY wrote, in order.
    bytes output = 3;
    // exited is always the session's last event.
    ShellExited exited = 4;
  }
}

// ShellStarted says the shell runs.
message ShellStarted {
  // shell is the program the agent started, as /bin/bash.
  string shell = 1;
}

// ShellExited ends a shell session.
message ShellExited {
  // denied is set when the agent refused the session: its ceiling does not
  // allow shells. Nothing ran.
  bool denied = 1;
  // exit_code is the shell's exit status; -1 if it did not run or was killed.
  int32 exit_code = 2;
  // error says why the session failed or was denied; empty when the shell
  // exited by itself.
  string error = 3;
}

// ScanRequest asks the agent to run a network discovery scan from the device
// (an ARP sweep of each subnet, with names from mDNS and LAN reverse DNS), for
// subnets the hub itself is not attached to. The agent runs it only if each
// subnet lies within its ceiling's scan subnets, and answers with a ScanResult
// of the same id. Hubs send it only to agents of protocol minor 7 and later.
message ScanRequest {
  // id correlates the ScanResult; unique per stream.
  string id = 1;
  // subnets are IPv4 CIDRs, at most 1024 addresses in all.
  repeated string subnets = 2;
  // timeout bounds the scan.
  google.protobuf.Duration timeout = 3;
}

// ScanResult is the outcome of a ScanRequest.
message ScanResult {
  // id is the id of the ScanRequest it answers.
  string id = 1;
  // denied is set when the agent refused the request: a subnet is beyond its
  // ceiling. Nothing was sent on the network.
  bool denied = 2;
  // error says why the scan failed or was denied; empty when it ran.
  string error = 3;
  // hosts are the hosts that answered, one per MAC address.
  repeated ScannedHost hosts = 4;
}

// ScannedHost is a host a scan found. The hub looks up its vendor.
message ScannedHost {
  // mac is lower-case and colon-separated.
  string mac = 1;
  string ip = 2;
  // hostname is from mDNS or LAN reverse DNS; empty if neither named it.
  string hostname = 3;
}

// NetEdges is what a device sees of its network, sent by agents of protocol
// minor 8 and later whose ceiling allows net_edges: shortly after the
// stream opens, then every minute. Each message replaces the last. The hub
// resolves the peers to devices and network hosts.
message NetEdges {
  // neighbors are the complete entries of the device's IPv4 neighbour (ARP)
  // table, then the resolved unicast entries of its IPv6 one (NDP), a
  // link-local address without its zone. Hubs before IPv6 neighbours skip
  // the IPv6 entries.
  repeated Neighbor neighbors = 1;
  // connections summarise the device's established TCP connections, one per
  // peer address, port and direction, loopback excluded.
  repeated Connection connections = 2;
  // connections_dropped counts the established connections left out
  // because the device holds more groups than the agent keeps.
  uint32 connections_dropped = 3;
}

// Neighbor is an entry of a neighbour table.
message Neighbor {
  string ip = 1;
  // mac is lower-case and colon-separated.
  string mac = 2;
}

// Connection is a group of established TCP connections with one peer.
message Connection {
  // peer_ip is the remote address; an IPv4-mapped IPv6 address is sent as
  // IPv4.
  string peer_ip = 1;
  // port is the service port: the peer's port of an outbound connection,
  // the device's own listening port of an inbound one.
  uint32 port = 2;
  // inbound is set when the peer connected to a port the device listens
  // on.
  bool inbound = 3;
  // count is how many such connections are established.
  uint32 count = 4;
}

// DockerRequest asks the agent to talk to the device's Docker or Podman
// engine, over its unix socket. The agent runs it only if its ceiling allows
// docker, and answers with a DockerResult of the same id. Hubs send it only
// to agents of protocol minor 9 and later.
message DockerRequest {
  // id correlates the DockerResult; unique per stream.
  string id = 1;
  // timeout bounds the request.
  google.protobuf.Duration timeout = 2;
  oneof op {
    // list lists the engine's containers, running or not, and its images.
    DockerList list = 3;
    // action starts, stops or restarts a container.
    DockerAction action = 4;
    // logs reads the last lines of a container's log, once: never a follow.
    DockerLogs logs = 5;
  }
}

// DockerList lists containers and images.
message DockerList {}

// DockerAction starts, stops or restarts a container.
message DockerAction {
  // verb is "start", "stop" or "restart".
  string verb = 1;
  // container is the container's id or name: letters, digits, '_', '.' and
  // '-', starting with a letter or digit, at most 128 characters.
  string container = 2;
}

// DockerLogs reads the last lines of a container's log.
message DockerLogs {
  // container is as in DockerAction.
  string container = 1;
  // tail is how many of the last lines to read; the agent caps it at 200.
  uint32 tail = 2;
}

// DockerResult is the outcome of a DockerRequest.
message DockerResult {
  // id is the id of the DockerRequest it answers.
  string id = 1;
  // denied is set when the agent refused the request: its ceiling does not
  // allow docker, or it is not one the agent takes. Nothing was asked of the
  // engine.
  bool denied = 2;
  // error says why the request failed or was denied; empty on success.
  string error = 3;
  // containers and images answer a list.
  repeated DockerContainer containers = 4;
  repeated DockerImage images = 5;
  // lines answer logs, oldest first.
  repeated LogLine lines = 6;
  // truncated is set when the agent left containers, images or log lines
  // out to keep the answer bounded.
  bool truncated = 7;
}

// DockerContainer is a container of the engine.
message DockerContainer {
  string id = 1;
  // name is without the leading '/'.
  string name = 2;
  string image = 3;
  // state is the engine's word for it: running, exited, created, paused, ...
  string state = 4;
  // status is the engine's human summary, such as "Up 2 hours".
  string status = 5;
  // compose_project and compose_service are the container's Compose labels
  // (com.docker.compose.project and com.docker.compose.service); empty
  // outside a Compose project.
  string compose_project = 6;
  string compose_service = 7;
  google.protobuf.Timestamp created = 8;
}

// DockerImage is an image of the engine, in summary.
message DockerImage {
  string id = 1;
  // tags are its repo:tag names; none for a dangling image.
  repeated string tags = 2;
  int64 size_bytes = 3;
  google.protobuf.Timestamp created = 4;
}

// UpgradeRequest asks the agent to replace its own binary with the hearth of
// an official release, named by its version only. The agent builds the URLs
// itself from its compiled-in release base (the project's GitHub releases)
// and its own platform, reads the release's checksums.txt, checks the
// archive against it, extracts hearth, runs `hearth version`, renames it
// over its executable (keeping the old one as <exe>.prev), answers with an
// UpgradeResult and exits, for its service manager to start the new binary.
// The hub cannot name another server or another hash. Sent to agents of
// protocol minor 11 and later.
message UpgradeRequest {
  // The hub named the archive and its hash before #347 shipped; the agent
  // finds both itself.
  reserved 3, 4;
  reserved "url", "sha256";
  string id = 1;
  // version is the release tag, such as v0.1.0.
  string version = 2;
}

// UpgradeResult answers an UpgradeRequest. ok means the new binary is in
// place and the agent exits to restart with it.
message UpgradeResult {
  string id = 1;
  bool ok = 2;
  // denied is set when the agent refuses to upgrade itself at all (a
  // Kubernetes pod, an upgrade already running); error says why.
  bool denied = 3;
  string error = 4;
  // version is what `<new binary> version` printed first.
  string version = 5;
  // url is the archive the agent chose, and sha256 its SHA-256 from the
  // release's checksums.txt, for the audit log; empty when it got no further.
  string url = 6;
  string sha256 = 7;
}

// LocalRules are the automations marked `local: true` whose checks run from
// this device (#70): the agent runs them itself, also while no hub is
// reachable, saves them, and reports what they did with LocalRuns. Every
// rule was allowed by the hub's policy when it was sent; the agent still
// checks each probe and restart against its effective capability ceiling
// when it runs. An empty list removes every rule.
message LocalRules {
  repeated LocalRule rules = 1;
  // version orders the rule sets of a device: the hybrid logical clock of
  // the newest automation document write (deletes included) the hub had
  // seen. The agent ignores a set older than the one it applied and saved.
  uint64 version = 2;
}

// LocalRule is one automation the device runs: its checks fire it, and its
// actions run in order, the first failure ending the run. A run in progress
// ignores the checks.
message LocalRule {
  // id is the automation's id.
  string id = 1;
  // digest identifies the automation's file: a rule whose digest did not
  // change keeps running across a new LocalRules.
  string digest = 2;
  repeated LocalTrigger triggers = 3;
  repeated LocalAction actions = 4;
}

// LocalTrigger is a check that fires its rule once it has failed for hold,
// checked every every. It fires once per outage: again only after it passed.
message LocalTrigger {
  // id is the trigger's step id, type its type: http, tcp or dns.
  string id = 1;
  string type = 2;
  // probe is the check; its timeout bounds each run of it.
  ProbeRequest probe = 3;
  google.protobuf.Duration every = 4;
  google.protobuf.Duration hold = 5;
  // target is what is checked, as it may be shown: a URL with its password
  // and query values redacted. Runs report it; the probe's URL is never
  // logged or reported.
  string target = 6;
}

// LocalAction is one step of a rule's run.
message LocalAction {
  // id is the action's step id, type its type: restart or check.
  string id = 1;
  string type = 2;
  // timeout bounds the step.
  google.protobuf.Duration timeout = 3;
  oneof action {
    RestartService restart = 4;
    ProbeRequest check = 5;
  }
}

// LocalRuns are runs of local rules the hub has not acknowledged yet, oldest
// first.
message LocalRuns {
  repeated LocalRun runs = 1;
  // dropped counts the runs the agent's bounded log let go, oldest first,
  // before any hub recorded them.
  uint64 dropped = 2;
}

// LocalRun is one run of a local rule.
message LocalRun {
  // seq orders the runs of a device; LocalRunsAck names the last recorded.
  uint64 seq = 1;
  // id is the run's id in the run history.
  string id = 2;
  // rule is the automation's id; trigger and trigger_type the trigger that
  // fired.
  string rule = 3;
  string trigger = 4;
  string trigger_type = 5;
  // target and trigger_error are what the failed check tells: its redacted
  // target and why it failed.
  string target = 6;
  string trigger_error = 7;
  google.protobuf.Timestamp started = 8;
  google.protobuf.Timestamp finished = 9;
  // status is succeeded, failed or denied; error says why when not succeeded.
  string status = 10;
  string error = 11;
  repeated LocalStep steps = 12;
  // hub_connected says whether the agent had a hub stream when the rule
  // fired.
  bool hub_connected = 13;
}

// LocalStep is the outcome of one action of a LocalRun.
message LocalStep {
  string id = 1;
  string type = 2;
  // status is ok, failed or denied (beyond the capability ceiling).
  string status = 3;
  string error = 4;
}

// LocalRunsAck acknowledges every LocalRun up to seq.
message LocalRunsAck {
  uint64 seq = 1;
}
