syntax = "proto3";

package hearth.cluster.v1;

// ClusterService admits new hubs into the cluster and hands members the CA
// key and node certificates. Every master serves it on its TLS listener.
service ClusterService {
  // Join consumes a join token, signs the new hub's CSR and hands it the CA
  // (the key only to a host that allows the master role). The joining hub
  // pins the CA with the fingerprint embedded in the token before it sends
  // the secret.
  rpc Join(JoinRequest) returns (JoinResponse);
  // FetchCAKey hands a member the CA key (a promotion to master), the new
  // CA's key during a hub CA rotation, or a renewed node certificate. The
  // caller authenticates with its hub node certificate; during a rotation it
  // must be the one the rotation pinned for it or one of the new CA. Decided
  // by policy and audited on the serving master, refusals included.
  rpc FetchCAKey(FetchCAKeyRequest) returns (FetchCAKeyResponse);
}

// JoinRequest describes the hub that wants to join.
message JoinRequest {
  // token_secret is the secret part of the join token, not the full string.
  string token_secret = 1;
  // node_id is the new hub's node ID; it is bound into its certificate.
  string node_id = 2;
  // address is the host:port other members dial for the hub's
  // --cluster-listen.
  string address = 3;
  // csr is a DER-encoded PKCS#10 certificate request. Its subject is ignored.
  bytes csr = 4;
  // schema_version is the newest store schema version the joining binary
  // supports. It must be at least the schema the cluster has written.
  int64 schema_version = 5;
  // allowed_roles are the roles the joining host allows (--allow-roles).
  // The hub is granted at most these and the join token's roles.
  repeated string allowed_roles = 7;
  reserved 6;
  reserved "cluster_epochs";
}

// JoinResponse is the new hub's identity and the cluster's CA.
message JoinResponse {
  // certificate is the DER-encoded hub node certificate.
  bytes certificate = 1;
  // ca_certificate is the DER-encoded hub CA certificate.
  bytes ca_certificate = 2;
  // ca_key is the CA private key, PKCS#8 DER, sent only to a hub granted
  // the master role. Store it at 0600; never log it.
  bytes ca_key = 3;
  // roles are the roles the hub is granted: those both its allowed_roles
  // and the join token allow. The hub starts with them.
  repeated string roles = 6;
  // seeds are the gossip addresses (host:port) the cluster's members
  // advertise, the joined master's first: the new hub finds the gossip by
  // them, not by the host of the URL it joined through (#334).
  repeated string seeds = 7;
  reserved 4, 5;
  reserved "leader_id", "last_index";
}

// FetchCAKeyRequest names the CA and carries the caller's CSR.
message FetchCAKeyRequest {
  // new_ca_fingerprint is the SHA-256 of the CA's certificate, hex: the new
  // CA during a rotation.
  string new_ca_fingerprint = 1;
  // csr is a DER certificate request for the caller's node certificate;
  // empty asks for the key only.
  bytes csr = 2;
  // old_ca_key_proof, during a rotation, is a signature by the current CA's
  // key over the message the hub names (key proof): a master proves it holds
  // that key to be handed the new one. Without it, the caller gets a node
  // certificate of the new CA, not the key.
  bytes old_ca_key_proof = 3;
}

// FetchCAKeyResponse carries a CA key and a node certificate.
message FetchCAKeyResponse {
  // ca_key is the CA's private key, PKCS #8 DER.
  bytes ca_key = 1;
  // certificate is the caller's node certificate, DER.
  bytes certificate = 2;
}
