syntax = "proto3";

package hearth.cluster.v1;

// ClusterService admits new hubs into a Raft cluster. It is served on the
// hub's TLS listener by the leader; a follower answers FAILED_PRECONDITION with
// the leader in the error metadata (hearth-leader-id, hearth-leader-addr).
service ClusterService {
  // Join consumes a join token, signs the new hub's CSR and hands it the CA,
  // key included, then adds it to the cluster as a non-voter. The joining hub
  // pins the CA with the fingerprint embedded in the token before it sends
  // the secret.
  rpc Join(JoinRequest) returns (JoinResponse);
  // Promote makes a joined hub a voter. The caller authenticates with the hub
  // node certificate it received from Join.
  rpc Promote(PromoteRequest) returns (PromoteResponse);
  // Forward proposes a store write on behalf of a follower hub, which cannot
  // propose to the Raft log itself. The caller authenticates with its hub
  // node certificate. The write's policy decision and audit entry were made
  // on the hub that received the user's request; this is only replication.
  rpc Forward(ForwardRequest) returns (ForwardResponse);
  // RemoveMember removes a hub from the Raft configuration and revokes its
  // hub node certificates, on behalf of a member hub whose operator asked for
  // it. Like Forward, the caller authenticates with its hub node certificate
  // and the policy decision and audit entry were made on that hub.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // TransferLeadership hands leadership to another voter, on behalf of a
  // member hub, authenticated and decided like RemoveMember.
  rpc TransferLeadership(TransferLeadershipRequest) returns (TransferLeadershipResponse);
  // SchemaInfo reports this hub's store schema: the version its database is
  // at and the newest its binary supports. Every member serves it, to
  // members presenting their hub node certificate. The leader asks every hub
  // before it migrates the cluster's schema.
  rpc SchemaInfo(SchemaInfoRequest) returns (SchemaInfoResponse);
  // MigrateSchema migrates the cluster's store schema on behalf of a member
  // hub, authenticated and decided like RemoveMember. The leader proposes it
  // to the Raft log only if every hub's binary supports the target version.
  rpc MigrateSchema(MigrateSchemaRequest) returns (MigrateSchemaResponse);
  // ConfigDigests reports a digest of each per-hub configuration item, so
  // hubs can notice that they disagree. Every member serves it, to members
  // presenting their hub node certificate. Digests never leave this channel.
  rpc ConfigDigests(ConfigDigestsRequest) returns (ConfigDigestsResponse);
}

// JoinRequest describes the hub that wants to join.
message JoinRequest {
  // token_secret is the secret part of the join token, not the full string.
  string token_secret = 1;
  // node_id is the new hub's Raft server ID; it is bound into its certificate.
  string node_id = 2;
  // raft_address is the host:port other hubs dial for Raft traffic.
  string raft_address = 3;
  // csr is a DER-encoded PKCS#10 certificate request. Its subject is ignored.
  bytes csr = 4;
  // schema_version is the newest store schema version the joining binary
  // supports. It must be at least the cluster's current schema version.
  int64 schema_version = 5;
  // cluster_epochs is true when the joining binary keeps a cluster epoch in its
  // certificates. A cluster restored from a backup refuses a hub without it.
  bool cluster_epochs = 6;
}

// JoinResponse is the new hub's identity and the cluster's CA.
message JoinResponse {
  // certificate is the DER-encoded hub node certificate.
  bytes certificate = 1;
  // ca_certificate is the DER-encoded hub CA certificate.
  bytes ca_certificate = 2;
  // ca_key is the CA private key, PKCS#8 DER. Store it at 0600; never log it.
  bytes ca_key = 3;
  // leader_id is the Raft server ID of the hub that admitted this one.
  string leader_id = 4;
  // last_index is the leader's last Raft log index when it admitted the hub.
  // The new hub is caught up once it has applied this index.
  uint64 last_index = 5;
}

// PromoteRequest asks the leader to make the calling hub a voter.
message PromoteRequest {
  // node_id must match the node ID in the caller's certificate.
  string node_id = 1;
}

// PromoteResponse is empty: success means the hub is a voter.
message PromoteResponse {}

// ForwardRequest carries one store command.
message ForwardRequest {
  // command is the command as encoded by the store (a versioned JSON
  // envelope), exactly the bytes that go into the Raft log.
  bytes command = 1;
}

// ForwardResponse is the outcome of applying the command on the leader.
message ForwardResponse {
  // result is the store result as JSON; empty when error_message is set.
  bytes result = 1;
  // error_kind names a known store error (not_found, token_used,
  // token_expired); empty for any other error.
  string error_kind = 2;
  // error_message is set when applying the command failed.
  string error_message = 3;
  // index is the Raft log index of the applied entry, also when the command
  // failed with a known error. The follower waits until it has applied this
  // index itself before it answers its caller (read-your-writes). Zero from
  // a leader that predates the field.
  uint64 index = 4;
}

// RemoveMemberRequest names the hub to remove.
message RemoveMemberRequest {
  // node_id is the Raft server ID of the hub to remove.
  string node_id = 1;
}

// RemoveMemberResponse is the outcome of a removal.
message RemoveMemberResponse {
  // revoked is the number of hub node certificates revoked.
  int32 revoked = 1;
}

// TransferLeadershipRequest names the voter to hand leadership to.
message TransferLeadershipRequest {
  // node_id is the voter to hand leadership to; empty lets the leader pick
  // the most up-to-date one.
  string node_id = 1;
}

// TransferLeadershipResponse is empty: success means the leader handed
// leadership over.
message TransferLeadershipResponse {}

// SchemaInfoRequest is empty.
message SchemaInfoRequest {}

// SchemaInfoResponse is a hub's store schema.
message SchemaInfoResponse {
  // current is the schema version the hub's database is at.
  int64 current = 1;
  // max is the newest schema version the hub's binary supports.
  int64 max = 2;
}

// MigrateSchemaRequest names the target schema version.
message MigrateSchemaRequest {
  // to is the schema version to migrate to. It must be newer than the
  // cluster's and supported by every hub.
  int64 to = 1;
}

// MigrateSchemaResponse is the outcome of a migration.
message MigrateSchemaResponse {
  // from is the schema version the cluster was at.
  int64 from = 1;
}

// ConfigDigestsRequest is empty.
message ConfigDigestsRequest {}

// ConfigDigestsResponse holds a hub's configuration digests.
message ConfigDigestsResponse {
  // digests maps a configuration item to its SHA-256 digest, in hex. An item
  // the hub could not read is left out.
  map<string, string> digests = 1;
}
