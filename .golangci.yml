# golangci-lint v2 configuration. https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - goheader
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
  settings:
    goheader:
      values:
        regexp:
          LICENSE: (AGPL-3\.0-only|Apache-2\.0)
      template: "SPDX-License-Identifier: {{ LICENSE }}"
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: strict
    presets:
      - common-false-positives
      - std-error-handling
    paths:
      - internal/proto

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gvart/hearth
  exclusions:
    generated: strict
    paths:
      - internal/proto

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
