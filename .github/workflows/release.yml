name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.x'
  NODE_VERSION: '24'

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    # HEARTH_RELEASE_SIGNING_KEY lives in this environment, which needs the
    # maintainer's approval: only an approved run signs a release.
    environment: release
    permissions:
      contents: write # GitHub release and assets
      packages: write # ghcr.io/gvart/hearth
      id-token: write # keyless cosign signing (Sigstore, GitHub OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changelog and version come from git history and tags
      - name: Check the release signing key is set
        env:
          HEARTH_RELEASE_SIGNING_KEY: ${{ secrets.HEARTH_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$HEARTH_RELEASE_SIGNING_KEY" ]; then
            echo "::error::the secret HEARTH_RELEASE_SIGNING_KEY of the release environment is empty: agents refuse an unsigned release (#359)"
            exit 1
          fi
      - name: Check docs name this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! grep -qxF "VERSION=$version" docs/getting-started.md; then
            echo "::error file=docs/getting-started.md::has no line VERSION=$version; bump the version in the docs in a PR before tagging $TAG"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: sigstore/cosign-installer@v4.1.3 # no floating v4 tag upstream
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Agents trust a release's checksums.txt only with this Ed25519
      # signature (#359). The tool refuses a key agents do not trust, and
      # never prints it.
      - name: Sign checksums.txt for the agents
        env:
          HEARTH_RELEASE_SIGNING_KEY: ${{ secrets.HEARTH_RELEASE_SIGNING_KEY }}
        run: go run ./internal/release/cmd/sign dist/checksums.txt
      - name: Upload checksums.txt.sig
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/checksums.txt.sig
