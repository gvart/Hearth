name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.x'
  NODE_VERSION: '24'

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    # HEARTH_RELEASE_SIGNING_KEY lives in this environment, which needs the
    # maintainer's approval: only an approved run signs a release.
    environment: release
    permissions:
      contents: write # GitHub release and assets
      packages: write # ghcr.io/gvart/hearth
      id-token: write # keyless cosign signing (Sigstore, GitHub OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changelog and version come from git history and tags
      - name: Check docs name this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! grep -qxF "VERSION=$version" docs/getting-started.md; then
            echo "::error file=docs/getting-started.md::has no line VERSION=$version; bump the version in the docs in a PR before tagging $TAG"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # Before anything is published: an empty, malformed or untrusted key
      # fails here rather than after the release is out unsigned (#359).
      - name: Check the release signing key
        env:
          HEARTH_RELEASE_SIGNING_KEY: ${{ secrets.HEARTH_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$HEARTH_RELEASE_SIGNING_KEY" ]; then
            echo "::error::the secret HEARTH_RELEASE_SIGNING_KEY of the release environment is empty: agents refuse an unsigned release"
            exit 1
          fi
          echo check >"$RUNNER_TEMP/sign-check.txt"
          go run ./internal/release/cmd/sign "$RUNNER_TEMP/sign-check.txt"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: sigstore/cosign-installer@v4.1.3 # no floating v4 tag upstream
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # goreleaser leaves the GitHub release a draft (.goreleaser.yaml
      # release.draft): it is published below only once checksums.txt.sig is
      # on it, so no published release lacks the signature agents need
      # (#359). If a step fails in between, the release stays an unpublished
      # draft: fix the cause and re-run, or publish it by hand after
      # uploading the .sig. The images are pushed by goreleaser already.
      # Agents trust a release's checksums.txt only with this Ed25519
      # signature. The tool refuses a key agents do not trust, and never
      # prints it.
      - name: Sign checksums.txt for the agents
        env:
          HEARTH_RELEASE_SIGNING_KEY: ${{ secrets.HEARTH_RELEASE_SIGNING_KEY }}
        run: go run ./internal/release/cmd/sign dist/checksums.txt
      - name: Upload checksums.txt.sig
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/checksums.txt.sig
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # A pre-release (vX.Y.Z-rc.N) is never "latest"; a release is.
          case "$TAG" in
            *-*) gh release edit "$TAG" --draft=false ;;
            *) gh release edit "$TAG" --draft=false --latest ;;
          esac
